name: Build, test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and regression tests (isolated data, offline providers)
        run: python scripts/release.py build
      - name: Build Store bundle when identity is configured
        if: vars.STORE_IDENTITY_NAME != ''
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: python scripts/release.py msix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release
          path: |
            artifacts/*
            .artifacts/tests/verification.json
          if-no-files-found: error
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: downloaded
      - name: Publish immutable versioned GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/WindowsCalendarWeatherWidget.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($env:TAG -ne "v$version") { throw 'Tag and project version differ' }
          $files = @(Get-ChildItem downloaded -Recurse -File | Where-Object { $_.Extension -in '.zip','.msixbundle' -or $_.Name -eq 'SHA256.txt' } | ForEach-Object FullName)
          if (!$files.Count) { throw 'No release artifacts found' }
          gh release create $env:TAG @files --verify-tag --title "Windows Calendar e Weather Widget $version" --notes-file docs/release-notes.md
          if ($LASTEXITCODE) { throw 'GitHub release failed; never replace an existing version silently' }
  store:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: downloaded
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Require the verified Partner Center identity and credentials
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        shell: pwsh
        run: |
          foreach ($key in 'STORE_PRODUCT_ID','TENANT_ID','SELLER_ID','CLIENT_ID','CLIENT_SECRET') {
            if (![Environment]::GetEnvironmentVariable($key)) { throw "Store setup missing: $key. Store publication is NOT complete." }
          }
          $package = @(Get-ChildItem downloaded -Recurse -Filter '*.msixbundle')
          if ($package.Count -ne 1) { throw 'Exactly one validated Store bundle is required' }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { throw 'Store authentication failed' }
          msstore publish $package[0].FullName -id $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE) { throw 'Store submission failed' }
          'Submission sent to Microsoft. Certification and public availability must be checked in Partner Center.' >> $env:GITHUB_STEP_SUMMARY
